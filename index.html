<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Từ Điển Ngôn Ngữ GenZ </title>
    <!-- Khai báo từ khóa để người dùng gõ trên Google là tìm thấy web bạn -->
    <meta name="keywords" content="từ điển genz, tu dien gen z, tra cuu tu long, flex, xit keo, gwenchana, ao trinh, cham kem, ngon ngu mang">
    <!-- Đoạn mô tả ngắn hiển thị dưới link Google -->
    <meta name="description" content="Nền tảng từ điển ngôn ngữ GenZ trực tuyến lớn nhất giúp tra cứu thuật ngữ mạng siêu tốc và định hướng giao tiếp chuẩn mực, chống tối cổ.">
    <meta name="google-site-verification" content="v6HAXXagbTHcqX4mfJkledz0-ppLSbe3KBhMWyqjSX8" />
    <!-- Kết nối đến file style.css để làm đẹp sau này -->
    <link rel="stylesheet" href="style.css">
</head>
    <!-- Bộ thẻ cấu hình Google SEO công khai toàn mạng -->
<title>Từ Điển Ngôn Ngữ GenZ Học Đường - Tra Cứu Văn Minh</title>
<meta name="description" content="Hệ sinh thái từ điển tương tác và Trợ lý ảo AI giải mã bối cảnh ngôn ngữ GenZ, định hướng giao tiếp văn minh gia đình và học đường tại Đà Nẵng.">
<meta name="keywords" content="từ điển genz, tu dien genz, tra cuu tu long genz, ngon ngu genz hoc duong, tro ly ao genz, trungdung1109 github">
<meta name="robots" content="index, follow">
<body>
    <div class="app-container">
        <h1>TỪ ĐIỂN NGÔN NGỮ GENZ </h1>
        <!-- KHU VỰC TRA CỨU MƯỢT MÀ -->
        <div class="search-section">
            <!-- Cấu trúc mới: Ô nhập liệu màu trắng riêng, Nút Tra cứu Oval Đỏ riêng -->
            <div class="search-row-container">
                <div class="search-input-wrapper">
                    <input type="text" id="search-input" placeholder="Gõ từ GenZ cần tra ở đây...">
                    <button id="clear-btn" class="clear-button">✖️</button>
                </div>
                <!-- Nút Tra Cứu hình Oval màu Đỏ -->
                <button id="search-btn" class="search-oval-btn">TRA CỨU</button>
            </div>
            
            <!-- Hộp thả danh sách từ gợi ý (Dropdown) -->
            <div id="suggestions-box" class="suggestions-dropdown"></div>
        </div>

        <!-- KHU VỰC HIỂN THỊ KẾT QUẢ TRA CỨU -->
        <div id="result-box" class="result-card">
            <p class="placeholder-text">Nhập ký tự để bắt đầu tra cứu hoặc chọn từ gợi ý nhé...</p>
        </div>

        <!-- KHU VỰC ĐÓNG GÓP TỪ MỚI (CÓ KIỂM DUYỆT) -->
        <div class="contribute-section">
            <h2>ĐÓNG GÓP TỪ MỚI CHỐNG TỐI CỔ </h2>
            
            <div class="form-group">
                <label>THUẬT NGỮ MẠNG (GENZ):</label>
                <input type="text" id="new-word" placeholder="Ví dụ: Xịt keo, Ao trình...">
            </div>

            <div class="form-group">
                <label>PHÂN LOẠI:</label>
                <input type="text" id="new-category" placeholder="Ví dụ: Từ ghép sáng tạo, Từ mượn...">
            </div>

            <div class="form-group">
                <label>TỪ CHUẨN MỰC:</label>
                <input type="text" id="new-standard" placeholder="Ví dụ: Đơ người, Vượt trội đẳng cấp...">
            </div>

            <div class="form-group">
                <label>Ý NGHĨA:</label>
                <textarea id="new-meaning" placeholder="Giải thích chi tiết nghĩa của từ..."></textarea>
            </div>

            <div class="form-group">
                <label>NGỮ CẢNH GIAO TIẾP:</label>
                <input type="text" id="new-context" placeholder="Ví dụ: Mô tả phản ứng bất ngờ...">
            </div>

            <div class="form-group">
                <label>LỜI KHUYÊN SỬ DỤNG:</label>
                <input type="text" id="new-advice" placeholder="Ví dụ: Dùng vui vẻ giữa bạn bè thân thiết...">
            </div>

            <button id="submit-btn" class="gradient-btn">GỬI LÊN VŨ TRỤ (CHỜ DUYỆT)</button>
        </div>
    </div>
<!-- Kết nối đến file dữ liệu 600 từ trước -->
<script src="data.js"></script>
<!-- Sau đó mới chạy file xử lý logic -->
<script src="script.js"></script>
<script src="contribute.js"></script>

<!-- ==================== KHU VỰC TRỢ LÝ AI GIẢI MÃ GENZ ==================== -->
<!-- 1. CỤM BONG BÓNG CHAT CÓ HIỂN THỊ TÊN CON BOT (CỐ ĐỊNH GÓC DƯỚI PHẢI) -->
<div id="ai-chat-bubble-wrapper" style="position: fixed; bottom: 25px; right: 25px; display: flex; align-items: center; gap: 12px; z-index: 999999; cursor: pointer;">
  <!-- Tên con bot hiển thị dạng nhãn chữ (Tag) bên cạnh bong bóng -->
  <div style="background: rgba(255, 255, 255, 0.95); color: #ff416c; padding: 8px 16px; border-radius: 20px; font-family: sans-serif; font-size: 13px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid rgba(255, 61, 108, 0.2); white-space: nowrap;">
    Trợ lý ảo giải mã ngôn ngữ GenZ ✨
  </div>
  <!-- Bong bóng chat hình tròn màu Đỏ-Cam Gradient -->
  <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #ff416c, #ff4b2b); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 20px rgba(255, 65, 108, 0.4);">
    <span style="font-size: 26px; color: white;">💬</span>
  </div>
</div>

<!-- 2. KHUNG CHỨA Ô CHAT DRAWER BUNG MỞ TRỰC TIẾP TRÊN WEB - MẶC ĐỊNH ẨN -->
<div id="ai-chat-drawer" style="display: none; position: fixed; bottom: 25px; right: 25px; width: 420px; height: 650px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); z-index: 999999; overflow: hidden; border: 1px solid rgba(0,0,0,0.08); flex-direction: column; animation: slideUpGenz 0.3s ease-out;">
  
  <!-- Thanh tiêu đề phía trên ô chat kèm nút đóng hình dấu X -->
  <div style="background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 14px; font-family: sans-serif;">Trợ lý ảo giải mã ngôn ngữ GenZ</span>
    <span id="ai-chat-close" style="cursor: pointer; font-size: 20px; padding: 0 5px; line-height: 20px;">✕</span>
  </div>
  
  <!-- ĐÃ THAY ĐƯỜNG LINK CHAT CƠ BẢN MỚI CHUẨN XÁC VÀ SẠCH LỖI ĐỎ -->
  <iframe src="https://udify.app/chatbot/g6nu3xu0U70xaUPL" style="width: 100%; height: calc(100% - 50px); border: none;" allow="microphone;clipboard-write"></iframe>
</div>

<style>
  /* Hiệu ứng trượt ô chat mượt mà từ dưới lên */
  @keyframes slideUpGenz {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>

<script>
  // Khởi tạo các biến điều khiển đóng/mở giao diện
  const aiBubbleWrapper = document.getElementById('ai-chat-bubble-wrapper');
  const aiDrawer = document.getElementById('ai-chat-drawer');
  const aiClose = document.getElementById('ai-chat-close');

  // Hành động: Khi click vào cụm bong bóng đỏ -> Ẩn bong bóng, mở bung ô chat ngăn kéo lên
  aiBubbleWrapper.addEventListener('click', function() {
    aiBubbleWrapper.style.display = 'none';
    aiDrawer.style.display = 'flex';
  });

  // Hành động: Khi click vào nút dấu ✕ -> Thu nhỏ ẩn ô chat, hiện lại cụm bong bóng có tên Bot
  aiClose.addEventListener('click', function() {
    aiDrawer.style.display = 'none';
    aiBubbleWrapper.style.display = 'flex';
  });
</script>
<!-- ==================== KẾT THÚC KHU VỰC TRỢ LÝ AI ==================== -->

</body>
</html>
