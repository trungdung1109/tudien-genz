    <!-- Đoạn mô tả ngắn hiển thị dưới link Google -->
    <meta name="description" content="Nền tảng từ điển ngôn ngữ GenZ trực tuyến lớn nhất giúp tra cứu thuật ngữ mạng siêu tốc và định hướng giao tiếp chuẩn mực, chống tối cổ.">

    <link rel="stylesheet" href="style.css">

    <!-- Bộ thẻ cấu hình Google SEO công khai toàn mạng -->
<title>Từ Điển Ngôn Ngữ GenZ Học Đường - Tra Cứu Văn Minh</title>
<meta name="description" content="Hệ sinh thái từ điển tương tác và Trợ lý ảo AI giải mã bối cảnh ngôn ngữ GenZ, định hướng giao tiếp văn minh gia đình và học đường tại Đà Nẵng.">
<meta name="keywords" content="từ điển genz, tu dien genz, tra cuu tu long genz, ngon ngu genz hoc duong, tro ly ao genz, trungdung1109 github">
<meta name="robots" content="index, follow">
<body>
    <div class="app-container">
        <h1>TỪ ĐIỂN NGÔN NGỮ GENZ </h1>
        <!-- KHU VỰC TRA CỨU MƯỢT MÀ -->
        <div class="search-section">
            <!-- Cấu trúc mới: Ô nhập liệu màu trắng riêng, Nút Tra cứu Oval Đỏ riêng -->
            <div class="search-row-container">
                <div class="search-input-wrapper">
                    <input type="text" id="search-input" placeholder="Gõ từ GenZ cần tra ở đây...">
                    <button id="clear-btn" class="clear-button">✖️</button>
                </div>
                <!-- Nút Tra Cứu hình Oval màu Đỏ -->
                <button id="search-btn" class="search-oval-btn">TRA CỨU</button>
            </div>
            
            <!-- Hộp thả danh sách từ gợi ý (Dropdown) -->
            <div id="suggestions-box" class="suggestions-dropdown"></div>
        </div>

        <!-- KHU VỰC HIỂN THỊ KẾT QUẢ TRA CỨU -->
        <div id="result-box" class="result-card">
            <p class="placeholder-text">Nhập ký tự để bắt đầu tra cứu hoặc chọn từ gợi ý nhé...</p>
        </div>

        <!-- KHU VỰC ĐÓNG GÓP TỪ MỚI (CÓ KIỂM DUYỆT) -->
        <div class="contribute-section">
            <h2>ĐÓNG GÓP TỪ MỚI CHỐNG TỐI CỔ </h2>
            
            <div class="form-group">
                <label>THUẬT NGỮ MẠNG (GENZ):</label>
                <input type="text" id="new-word" placeholder="Ví dụ: Xịt keo, Ao trình...">
            </div>

            <div class="form-group">
                <label>PHÂN LOẠI:</label>
                <input type="text" id="new-category" placeholder="Ví dụ: Từ ghép sáng tạo, Từ mượn...">
            </div>

            <div class="form-group">
                <label>TỪ CHUẨN MỰC:</label>
                <input type="text" id="new-standard" placeholder="Ví dụ: Đơ người, Vượt trội đẳng cấp...">
            </div>

            <div class="form-group">
                <label>Ý NGHĨA:</label>
                <textarea id="new-meaning" placeholder="Giải thích chi tiết nghĩa của từ..."></textarea>
            </div>

            <div class="form-group">
                <label>NGỮ CẢNH GIAO TIẾP:</label>
                <input type="text" id="new-context" placeholder="Ví dụ: Mô tả phản ứng bất ngờ...">
            </div>

            <div class="form-group">
                <label>LỜI KHUYÊN SỬ DỤNG:</label>
                <input type="text" id="new-advice" placeholder="Ví dụ: Dùng vui vẻ giữa bạn bè thân thiết...">
            </div>

            <button id="submit-btn" class="gradient-btn">GỬI LÊN VŨ TRỤ (CHỜ DUYỆT)</button>
        </div>
    </div>
<!-- Kết nối đến file dữ liệu 600 từ trước -->
<script src="data.js"></script>
<!-- Sau đó mới chạy file xử lý logic -->
<script src="script.js"></script>
<script src="contribute.js"></script>

<!-- ===================================== -->
<!-- PHẦN CẤU HÌNH PHÒNG CHÁT DỰ THI ĐỘC LẬP -->
<!-- ===================================== -->

<!-- Nút bấm mở phòng Chat giải mã GenZ cố định ở góc dưới bên phải -->
<div style="position: fixed; bottom: 25px; right: 25px; z-index: 99999;">
    <button onclick="moPhongChatGenZ()" 
            style="background-color: #ff0055; color: white; padding: 14px 24px; border-radius: 30px; font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; border: none; box-shadow: 0px 4px 15px rgba(255, 0, 85, 0.4); display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.3s ease;">
       🤖 Trợ Lý AI Giải Mã ngôn ngữ GenZ (Click để Chat)
    </button>
</div>

<!-- Khung nền đen mờ bao phủ toàn màn hình khi mở phòng chat -->
<div id="vung-nen-chat" onclick="dongPhongChatGenZ()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); z-index: 100000; justify-content: center; align-items: center;">
    
    <!-- Cửa sổ phòng Chat chính hiển thị bên phải màn hình -->
    <div onclick="event.stopPropagation()" style="position: relative; width: 90%; max-width: 450px; height: 80vh; background: #161a23; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid #2d3748; display: flex; flex-direction: column;">
        
        <!-- Thanh tiêu đề phòng chat và nút đóng -->
        <div style="background-color: #1a202c; padding: 15px; color: white; font-weight: bold; font-family: sans-serif; border-bottom: 1px solid #2d3748; display: flex; justify-content: space-between; align-items: center;">
            <span>🤖 Trợ Lý Từ Điển GenZ AI</span>
            <button onclick="dongPhongChatGenZ()" style="background: none; border: none; color: #a0aec0; font-size: 22px; cursor: pointer; padding: 0 5px;">&times;</button>
        </div>

        <!-- Nhúng trực tiếp giao diện phòng chat công khai của bạn từ Glanceia -->
        <iframe 
            src="https://glanceia.com/chat/chat-widget/6acde80e62f3390e00ee52f3" 
            style="width: 100%; height: 100%; border: none; background: #161a23;"
            allow="clipboard-write">
        </iframe>
    </div>
</div>

<script>
  // Hàm điều khiển bung cửa sổ phòng chat lên giữa màn hình
  function moPhongChatGenZ() {
      document.getElementById('vung-nen-chat').style.display = 'flex';
  }

  // Hàm điều khiển ẩn cửa sổ phòng chat đi khi bấm nút đóng hoặc bấm ra ngoài khung
  function dongPhongChatGenZ() {
      document.getElementById('vung-nen-chat').style.display = 'none';
  }
</script>

<!-- ===================================== -->
<!-- KẾT THÚC PHẦN PHÒNG CHÁT -->
<!-- ===================================== -->

</body>
</html>
