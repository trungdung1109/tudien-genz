<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Từ Điển Ngôn Ngữ GenZ </title>
    <!-- Khai báo từ khóa để người dùng gõ trên Google là tìm thấy web bạn -->
    <meta name="keywords" content="từ điển genz, tu dien gen z, tra cuu tu long, flex, xit keo, gwenchana, ao trinh, cham kem, ngon ngu mang">
    <!-- Đoạn mô tả ngắn hiển thị dưới link Google -->
    <meta name="description" content="Nền tảng từ điển ngôn ngữ GenZ trực tuyến lớn nhất giúp tra cứu thuật ngữ mạng siêu tốc và định hướng giao tiếp chuẩn mực, chống tối cổ.">
    <meta name="google-site-verification" content="v6HAXXagbTHcqX4mfJkledz0-ppLSbe3KBhMWyqjSX8" />
    <!-- Kết nối đến file style.css để làm đẹp sau này -->
    <link rel="stylesheet" href="style.css">
</head>
    <!-- Bộ thẻ cấu hình Google SEO công khai toàn mạng -->
<title>Từ Điển Ngôn Ngữ GenZ Học Đường - Tra Cứu Văn Minh</title>
<meta name="description" content="Hệ sinh thái từ điển tương tác và Trợ lý ảo AI giải mã bối cảnh ngôn ngữ GenZ, định hướng giao tiếp văn minh gia đình và học đường tại Đà Nẵng.">
<meta name="keywords" content="từ điển genz, tu dien genz, tra cuu tu long genz, ngon ngu genz hoc duong, tro ly ao genz, trungdung1109 github">
<meta name="robots" content="index, follow">
<body>
    <div class="app-container">
        <h1>TỪ ĐIỂN NGÔN NGỮ GENZ </h1>
        <!-- KHU VỰC TRA CỨU MƯỢT MÀ -->
        <div class="search-section">
            <!-- Cấu trúc mới: Ô nhập liệu màu trắng riêng, Nút Tra cứu Oval Đỏ riêng -->
            <div class="search-row-container">
                <div class="search-input-wrapper">
                    <input type="text" id="search-input" placeholder="Gõ từ GenZ cần tra ở đây...">
                    <button id="clear-btn" class="clear-button">✖️</button>
                </div>
                <!-- Nút Tra Cứu hình Oval màu Đỏ -->
                <button id="search-btn" class="search-oval-btn">TRA CỨU</button>
            </div>
            
            <!-- Hộp thả danh sách từ gợi ý (Dropdown) -->
            <div id="suggestions-box" class="suggestions-dropdown"></div>
        </div>

        <!-- KHU VỰC HIỂN THỊ KẾT QUẢ TRA CỨU -->
        <div id="result-box" class="result-card">
            <p class="placeholder-text">Nhập ký tự để bắt đầu tra cứu hoặc chọn từ gợi ý nhé...</p>
        </div>

        <!-- KHU VỰC ĐÓNG GÓP TỪ MỚI (CÓ KIỂM DUYỆT) -->
        <div class="contribute-section">
            <h2>ĐÓNG GÓP TỪ MỚI CHỐNG TỐI CỔ </h2>
            
            <div class="form-group">
                <label>THUẬT NGỮ MẠNG (GENZ):</label>
                <input type="text" id="new-word" placeholder="Ví dụ: Xịt keo, Ao trình...">
            </div>

            <div class="form-group">
                <label>PHÂN LOẠI:</label>
                <input type="text" id="new-category" placeholder="Ví dụ: Từ ghép sáng tạo, Từ mượn...">
            </div>

            <div class="form-group">
                <label>TỪ CHUẨN MỰC:</label>
                <input type="text" id="new-standard" placeholder="Ví dụ: Đơ người, Vượt trội đẳng cấp...">
            </div>

            <div class="form-group">
                <label>Ý NGHĨA:</label>
                <textarea id="new-meaning" placeholder="Giải thích chi tiết nghĩa của từ..."></textarea>
            </div>

            <div class="form-group">
                <label>NGỮ CẢNH GIAO TIẾP:</label>
                <input type="text" id="new-context" placeholder="Ví dụ: Mô tả phản ứng bất ngờ...">
            </div>

            <div class="form-group">
                <label>LỜI KHUYÊN SỬ DỤNG:</label>
                <input type="text" id="new-advice" placeholder="Ví dụ: Dùng vui vẻ giữa bạn bè thân thiết...">
            </div>

            <button id="submit-btn" class="gradient-btn">GỬI LÊN VŨ TRỤ (CHỜ DUYỆT)</button>
        </div>
    </div>
<!-- Kết nối đến file dữ liệu 600 từ trước -->
<script src="data.js"></script>
<!-- Sau đó mới chạy file xử lý logic -->
<script src="script.js"></script>
<script src="contribute.js"></script>
<!-- ======================================================= -->
<!-- KHUNG PHÒNG CHAT TRỢ LÝ AI ĐỘC LẬP TỐI ƯU DỰ THI -->
<!-- ======================================================= -->

<!-- Dòng chữ gợi ý kiêm nút bấm mở phòng chat cố định ở góc dưới bên phải -->
<div onclick="moOChatTypebot()" 
     style="position: fixed; bottom: 25px; right: 25px; z-index: 99999; background: #161a23; color: #ff0055; border: 1px solid #ff0055; padding: 12px 22px; border-radius: 25px; font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 14px; box-shadow: 0px 4px 15px rgba(255, 0, 85, 0.4); cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;">
   🤖 Trợ lý ảo AI giải mã ngôn ngữ GenZ (Click để Chat)
</div>

<!-- Cửa sổ phòng Chat bung mở mượt mà giữa màn hình, bỏ qua lỗi chặn mạng jsdelivr -->
<div id="vung-nen-typebot" onclick="dongOChatTypebot()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); z-index: 100000; justify-content: center; align-items: center;">
    <div onclick="event.stopPropagation()" style="position: relative; width: 90%; max-width: 440px; height: 80vh; background: #161a23; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid #2d3748; display: flex; flex-direction: column;">
        
        <!-- Thanh tiêu đề phòng chat và nút đóng nhanh -->
        <div style="background-color: #1a202c; padding: 15px; color: white; font-weight: bold; font-family: sans-serif; border-bottom: 1px solid #2d3748; display: flex; justify-content: space-between; align-items: center;">
            <span>🤖 Trợ Lý Giải Mã GenZ AI</span>
            <button onclick="dongOChatTypebot()" style="background: none; border: none; color: #a0aec0; font-size: 24px; cursor: pointer; padding: 0 5px; line-height: 1;">&times;</button>
        </div>

        <!-- ĐÂY LÀ ĐƯỜNG LINK HIỂN THỊ CHUẨN: Dành riêng cho khách vãng lai, tự động đồng bộ từ sơ đồ của bạn -->
        <iframe 
            src="https://typebot.io" 
            style="width: 100%; height: 100%; border: none; background: #161a23;"
            allow="clipboard-write">
        </iframe>
    </div>
</div>

<script>
  // Các hàm điều khiển đóng mở bằng JavaScript thuần, cam kết 100% không lo đơ lệnh
  function moOChatTypebot() {
      document.getElementById('vung-nen-typebot').style.display = 'flex';
  }
  function dongOChatTypebot() {
      document.getElementById('vung-nen-typebot').style.display = 'none';
  }
</script>

<!-- ======================================================= -->
<!-- KẾT THÚC PHẦN CODE CHATBOT -->
<!-- ======================================================= -->

</body>
</html>
